<head>
  <meta charset="UTF-8" />

  <meta name="color-scheme" content="light" />
  <title>Withinarts | Handcrafted Acrylic Paintings & Fine Art Studio</title>
  <meta name="description"
    content="Authentic handmade acrylic paintings, Sufi art, and Islamic calligraphy crafted in Faisalabad on natural bark wood slices and solid wood frames, shipped in eco-friendly jute packaging." />
  <!-- Google Fonts for Luxury Fine Art Atelier -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- SPA Routing Redirect Decoder for Direct Sub-URLs -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
